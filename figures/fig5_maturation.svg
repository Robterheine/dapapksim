<text x="12" y="22" font-size="15" font-weight="bold">Figure 5. Maturation functions (fraction of adult UGT1A9 activity) vs age</text>
<text x="12" y="38" font-size="10.5" fill="#444">App options (normalised to AdultMax = 1): Farhan et al. 2024 (jcph.2484) and Badee et al. 2019 via Jo et al. 2021 scenario 2 (psp4.12577).</text>
<text x="12" y="52" font-size="10.5" fill="#444">Reference curves: Jo 2021 PBPK scenario 1 (Simcyp default) and scenario 2 (= Badee option). Log x-axis.</text>
<text x="12" y="68" font-size="11" font-weight="bold" fill="#1a7f37">VERDICT: PASS - both app options reach ~1 by ~1-2 y; adults and 10-17 y are barely affected (MAT 0.82-1.00); only &lt;2 y differs materially.</text>
